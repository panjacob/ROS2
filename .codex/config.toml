# Primary session defaults: the root session is the orchestrator.
model = "gpt-6.1-sol"
model_reasoning_effort = "medium"

[agents]
enabled = true
# Two child threads plus the primary orchestrator: at most three active agents.
max_concurrent_threads_per_session = 2
default_subagent_model = "gpt-6.1-sol"
default_subagent_reasoning_effort = "medium"
