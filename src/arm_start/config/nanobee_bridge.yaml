nanobee_bridge:
  ros__parameters:
    # USB serial to the MKS TinyBee running NanoBee firmware (NanoBee/).
    # Steps per degree, max speed/acceleration, homing modes and soft limits are NOT set here:
    # the bridge reads them from the board at startup (NanoBee/NanoBeeDriver/config.yaml,
    # pushed to the board). Call ~/reload_settings after changing them on the board, or edit
    # config.yaml on the ROS web page and "Send to board" (~/push_config; config_path is set by
    # arm.launch.py, launch argument board_config).
    serial_port: /dev/ttyUSB0
    baud: 115200
    connect_timeout: 8.0      # s to wait for the board to answer after opening the port

    # ROS joint names in firmware joint order J0..J4.
    joint_names: [joint1, joint2, joint3, joint4, joint5]

    status_rate: 20.0         # Hz, status queries ("?") -> joint_states
    command_timeout: 1.0      # s to wait for "ok"/"err" to one command
    move_speed: 0.0           # deg/s for joint_command moves (0 = board motion.default_speed)

    # FollowJointTrajectory action /arm_controller/follow_joint_trajectory (MoveIt execution).
    # Joint limits come from robot_description (passed by arm.launch.py); the board's
    # joints.max_speed and soft limits are checked too.
    status_timeout: 0.5               # s, status reports older than this make the state stale
    trajectory_start_tolerance: 0.02  # rad, a t=0 point must be this close to the measured state
    trajectory_goal_tolerance: 0.01   # rad, final error allowed once the board reports Idle
    trajectory_time_scaling: 1.5      # allowed time = duration * scaling + margin
    trajectory_time_margin: 2.0       # s (a goal_time_tolerance > 0 replaces both)

    # Velocity jog (topic "jog"): J commands sent at jog_rate, stop after jog_timeout s without messages
    jog_rate: 20.0
    jog_timeout: 0.3
    max_jog_speed: 360.0  # deg/s per joint (the board's joints.max_speed also applies)
