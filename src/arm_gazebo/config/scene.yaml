# Metres, in world. The tabletop and the robot mounting plane are at z=0.
table:
  center: [0.15, 0.0, -0.025]
  size: [1.0, 0.7, 0.05]
  height: 0.75
banana:
  position: [0.28, 0.0, 0.021]
  half_length: 0.075
  bend: 0.035
  radius: 0.018
  segments: 13
approach:
  # Height above the highest collision sphere, not above the model origin.
  clearance: 0.10
cameras:
  # Order determines the camera number. Poses are [x, y, z, roll, pitch, yaw].
  - parent: tool0
    pose: [0, 0, 0.005, 0, -1.5707963268, 0]
    near: 0.01
  - parent: world
    pose: [0.70, -0.75, 0.85, 0, 0.61, 2.21]
  - parent: world
    pose: [0.15, 0, 1.15, 0, 1.5707963268, 1.5707963268]
